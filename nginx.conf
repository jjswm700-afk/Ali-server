# ==============================================================================
# إعداد Nginx Reverse Proxy لنظام صيانة العجلات
# المسار المستهدف على السيرفر: /etc/nginx/sites-available/wheel-api
# ==============================================================================

server {
    listen 80;
    server_name api.yourdomain.com; # استبدل هذا بالنطاق الخاص بك أو عنوان IP للسيرفر

    # السماح برفع صور الفواتير والملفات حتى 25 ميجابايت دون حظر HTTP 413
    client_max_body_size 25M;

    # ضغط البيانات لتسريع التحميل وتوفير استهلاك باقة الإنترنت
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1000;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # تمرير الترويسات الداعمة لـ WebSockets والاتصال الدائم
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # تمرير معلومات العميل الحقيقية
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # مهلة الاتصال بالخلفية
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_cache_bypass $http_upgrade;
    }
}
